name: Docker Test & Publish

env:
  IMAGE_NAME: ${{ github.repository_owner }}
  REGISTRY: ghcr.io

on:
  push:
    branches:
      - main

    tags:
      - "*"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/docker.yaml"
      - ".vscode/**"
      - ".gitignore"
      - "stack/**"
      - "LICENSE"
      - "README"
  workflow_dispatch:

jobs:
  base:
    name: Build base image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    steps:
     # login
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # lower case name
      - name: Set image name to lowercase
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV
      # Configure build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image
      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.IMAGE_NAME_LC }}/base:latest
          cache-from: type=gha,scope=buildx-base-multi-arch
          cache-to: type=gha,scope=buildx-base-multi-arch,mode=max

  publish:
    needs: [base]
    name: Build ${{ matrix.project }} image
    runs-on: ubuntu-latest
    #if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        project: [delta, bonfire, autumn , january , gifbox, crond, pushd, voice-ingress]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lower case name
      - name: Set image name to lowercase
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Resolve project metadata
        uses: kanga333/variable-mapper@master
        id: export
        with:
          key: "${{ matrix.project }}"
          map: |
            {
              "delta": {
                "path": "crates/delta",
                "tag": "${{ env.IMAGE_NAME_LC }}/api"
              },
              "bonfire": {
                "path": "crates/bonfire",
                "tag": "${{ env.IMAGE_NAME_LC }}/events"
              },
              "autumn": {
                "path": "crates/services/autumn",
                "tag": "${{ env.IMAGE_NAME_LC }}/file-server"
              },
              "january": {
                "path": "crates/services/january",
                "tag": "${{ env.IMAGE_NAME_LC }}/proxy"
              },
              "gifbox": {
                "path": "crates/services/gifbox",
                "tag": "${{ env.IMAGE_NAME_LC }}/gifbox"
              },
              "crond": {
                "path": "crates/daemons/crond",
                "tag": "${{ env.IMAGE_NAME_LC }}/crond"
              },
              "pushd": {
                "path": "crates/daemons/pushd",
                "tag": "${{ env.IMAGE_NAME_LC }}/pushd"
              },
              "voice-ingress": {
                "path": "crates/daemons/voice-ingress",
                "tag": "${{ env.IMAGE_NAME_LC }}/voice-ingress"
              }
            }
          export_to: output

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.export.outputs.tag }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.export.outputs.path }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ env.IMAGE_NAME_LC }}/base:latest
          cache-from: type=gha,scope=buildx-base-multi-arch
          cache-to: type=gha,scope=buildx-base-multi-arch,mode=max
