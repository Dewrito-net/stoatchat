name: Docker Test & Publish

on:
  push:
    branches:
      - main

    tags:
      - "*"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/docker.yaml"
      - ".vscode/**"
      - ".gitignore"
      - "stack/**"
      - "LICENSE"
      - "README"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  base:
    name: Build base image
    runs-on: self-hosted
    timeout-minutes: 200

    permissions:
      contents: read
      packages: write


    steps:
     # login
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Configure build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #clean cache
      - name: Clean cargo cache
         run: cargo clean

      # Build the image
      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: ghcr.io/dewrito-net/base:latest
          #cache-from: type=gha,scope=buildx-base-multi-arch
          #cache-to: type=gha,scope=buildx-base-multi-arch,mode=max

  publish:
    needs: [base]
    name: Build ${{ matrix.project }} image
    runs-on: ubuntu-latest
    #if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        project: [delta, bonfire, autumn , january , gifbox, crond, pushd, voice-ingress]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve project metadata
        uses: kanga333/variable-mapper@master
        id: export
        with:
          key: "${{ matrix.project }}"
          map: |
            {
              "delta": {
                "path": "crates/delta",
                "tag": "dewrito-net/api"
              },
              "bonfire": {
                "path": "crates/bonfire",
                "tag": "dewrito-net/events"
              },
              "autumn": {
                "path": "crates/services/autumn",
                "tag": "dewrito-net/file-server"
              },
              "january": {
                "path": "crates/services/january",
                "tag": "dewrito-net/proxy"
              },
              "gifbox": {
                "path": "crates/services/gifbox",
                "tag": "dewrito-net/gifbox"
              },
              "crond": {
                "path": "crates/daemons/crond",
                "tag": "dewrito-net/crond"
              },
              "pushd": {
                "path": "crates/daemons/pushd",
                "tag": "dewrito-net/pushd"
              },
              "voice-ingress": {
                "path": "crates/daemons/voice-ingress",
                "tag": "dewrito-net/voice-ingress"
              }
            }
          export_to: output




      

